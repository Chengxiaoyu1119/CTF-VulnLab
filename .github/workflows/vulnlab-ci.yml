name: VulnLab CI

on:
  push:
    paths:
      - ".github/workflows/vulnlab-ci.yml"
      - "src/**"
      - "script/check_vulnlab_node.mjs"
      - "script/smoke_vulnlab.mjs"
      - "script/smoke_vulnlab_native_php.mjs"
      - "script/smoke_vulnlab_native_php_mysql.mjs"
      - "script/smoke_vulnlab_builtin_runtimes.mjs"
      - "script/smoke_vulnlab_project_toolchains.mjs"
      - "script/test_vulnlab_importer.mjs"
      - "script/test_vulnlab_builtin_assets.mjs"
      - "script/test_vulnlab_runtime_status.mjs"
      - "script/test_vulnlab_runtime_prep.mjs"
      - "script/test_vulnlab_database.mjs"
      - "script/test_vulnlab_expiration.mjs"
      - "script/test_vulnlab_provider.mjs"
      - "script/test_vulnlab_mysql.mjs"
      - "script/test_vulnlab_runtime_toolchains.mjs"
      - "script/test_vulnlab_project_environment.mjs"
      - "script/smoke_vulnlab_operational.mjs"
      - "script/browser_check_vulnlab.py"
      - "script/run_browser_check_vulnlab.mjs"
      - "script/run_vulnlab.ps1"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/vulnlab-ci.yml"
      - "src/**"
      - "script/check_vulnlab_node.mjs"
      - "script/smoke_vulnlab.mjs"
      - "script/smoke_vulnlab_native_php.mjs"
      - "script/smoke_vulnlab_native_php_mysql.mjs"
      - "script/smoke_vulnlab_builtin_runtimes.mjs"
      - "script/smoke_vulnlab_project_toolchains.mjs"
      - "script/test_vulnlab_database.mjs"
      - "script/test_vulnlab_expiration.mjs"
      - "script/test_vulnlab_importer.mjs"
      - "script/test_vulnlab_builtin_assets.mjs"
      - "script/test_vulnlab_runtime_status.mjs"
      - "script/test_vulnlab_runtime_prep.mjs"
      - "script/test_vulnlab_provider.mjs"
      - "script/test_vulnlab_mysql.mjs"
      - "script/test_vulnlab_runtime_toolchains.mjs"
      - "script/test_vulnlab_project_environment.mjs"
      - "script/smoke_vulnlab_operational.mjs"
      - "script/browser_check_vulnlab.py"
      - "script/run_browser_check_vulnlab.mjs"
      - "script/run_vulnlab.ps1"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnlab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-app:
    name: Node.js app and Windows runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Audit all dependencies
        working-directory: src
        run: npm audit --audit-level=high

      - name: Type check
        working-directory: src
        run: npm run check

      - name: Build Node app
        working-directory: src
        run: npm run build

      - name: Test importer and Provider fixtures
        working-directory: src
        run: npm test

      - name: Check structure and scripts
        run: |
          node --check src/public/app.js
          node --check script/check_vulnlab_node.mjs
          node --check script/smoke_vulnlab.mjs
          node --check script/smoke_vulnlab_native_php.mjs
          node --check script/smoke_vulnlab_native_php_mysql.mjs
          node --check script/smoke_vulnlab_builtin_runtimes.mjs
          node --check script/smoke_vulnlab_project_toolchains.mjs
          node --check script/test_vulnlab_importer.mjs
          node --check script/test_vulnlab_builtin_assets.mjs
          node --check script/test_vulnlab_runtime_status.mjs
          node --check script/test_vulnlab_database.mjs
          node --check script/test_vulnlab_expiration.mjs
          node --check script/test_vulnlab_provider.mjs
          node --check script/test_vulnlab_mysql.mjs
          node --check script/test_vulnlab_runtime_toolchains.mjs
          node --check script/test_vulnlab_project_environment.mjs
          node --check script/smoke_vulnlab_operational.mjs
          node --check script/run_browser_check_vulnlab.mjs
          node script/check_vulnlab_node.mjs

      - name: Run API smoke test
        env:
          VULNLAB_BASE_URL: http://127.0.0.1:6710
          VULNLAB_PORT: 6710
          VULNLAB_DATA_DIR: ${{ runner.temp }}/vulnlab-data
          VULNLAB_AUTO_INSTALL_BUILTINS: 0
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'vulnlab.log'
          $errorLog = Join-Path $env:RUNNER_TEMP 'vulnlab-error.log'
          $pidPath = Join-Path $env:RUNNER_TEMP 'vulnlab.pid'
          $process = Start-Process -FilePath node -ArgumentList 'src/dist/server.js' -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $log -RedirectStandardError $errorLog -PassThru
          $process.Id | Set-Content -Path $pidPath
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:6710/healthz | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'VulnLab did not become ready on port 6710.' }
            node script/smoke_vulnlab.mjs
            if ($LASTEXITCODE -ne 0) { throw "API smoke test exited with code $LASTEXITCODE." }
          } finally {
            if (Test-Path $pidPath) { Stop-Process -Id (Get-Content $pidPath) -Force -ErrorAction SilentlyContinue }
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $errorLog) { Get-Content $errorLog }
          }

      - name: Run operational smoke test
        run: node script/smoke_vulnlab_operational.mjs

      - name: Install browser smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run browser and responsive smoke test
        run: node script/run_browser_check_vulnlab.mjs
